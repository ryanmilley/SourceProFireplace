name: Compile iOS IPA Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize & Cache Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
        cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

    - name: Automatically Rebuild Clean Project Architecture
      run: |
        flutter create . --platforms=ios --org com.example --project-name fireplace_controller --overwrite
        
    - name: Re-Inject Apple Bluetooth Privacy Keys
      run: |
        cat << 'INNER_EOF' > ios/Runner/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.example.fireplaceController</string>
            <key>CFBundleExecutable</key>
            <string>Runner</string>
            <key>CFBundleName</key>
            <string>Fireplace</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>NSBluetoothAlwaysUsageDescription</key>
            <string>This app requires Bluetooth permissions to connect and write data to your physical fireplace device controller.</string>
            <key>NSBluetoothPeripheralUsageDescription</key>
            <string>This app requires peripheral Bluetooth capabilities to dispatch framed control payloads to home appliances.</string>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>
        INNER_EOF

    - name: Cache Pub Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Fetch Library Dependencies
      run: flutter pub get

    - name: Build Official Compiled App Binaries
      run: |
        # This compiles the missing executable runner binary file
        flutter build ios --config-only
        xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos OBJROOT=build/ios SYMROOT=build/ios CODE_SIGNING_ALLOWED=NO

    - name: Package App Architecture into True IPA Archive
      run: |
        # Construct a structurally pristine Payload containing the compiled executable binary
        mkdir -p Payload
        cp -R build/ios/Release-iphoneos/Runner.app Payload/
        zip -r -y FireplaceRemote.ipa Payload

    - name: Archive IPA Output Artifact to GitHub Dashboard
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-iPhone-App
        path: FireplaceRemote.ipa
