name: Compile iOS IPA Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize & Cache Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
        cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

    - name: Automatically Rebuild Clean Project Architecture
      run: |
        flutter create . --platforms=ios --overwrite
        
    - name: Re-Inject Apple Bluetooth Privacy Keys
      run: |
        cat << 'INNER_EOF' > ios/Runner/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.example.fireplaceController</string>
            <key>CFBundleName</key>
            <string>Fireplace</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>NSBluetoothAlwaysUsageDescription</key>
            <string>This app requires Bluetooth permissions to connect and write data to your physical fireplace device controller.</string>
            <key>NSBluetoothPeripheralUsageDescription</key>
            <string>This app requires peripheral Bluetooth capabilities to dispatch framed control payloads to home appliances.</string>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>
        INNER_EOF

    - name: Fetch Library Dependencies
      run: flutter pub get

    - name: Build iOS Workspace Directory
      run: flutter build ios --release --no-codesign

    - name: Standardize App Bundle Metadata Structure
      run: |
        # Inject required variables to prevent signing application validation errors
        /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.example.fireplaceController" build/ios/iphoneos/Runner.app/Info.plist || /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.example.fireplaceController" build/ios/iphoneos/Runner.app/Info.plist
        /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.0" build/ios/iphoneos/Runner.app/Info.plist || /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" build/ios/iphoneos/Runner.app/Info.plist
        /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" build/ios/iphoneos/Runner.app/Info.plist || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" build/ios/iphoneos/Runner.app/Info.plist
        /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" build/ios/iphoneos/Runner.app/Info.plist || /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" build/ios/iphoneos/Runner.app/Info.plist

    - name: Package App Architecture into IPA Archive
      run: |
        mkdir -p Payload
        mv build/ios/iphoneos/Runner.app Payload/
        zip -r FireplaceRemote.ipa Payload
        
    - name: Archive IPA Output Artifact to GitHub Dashboard
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-iPhone-App
        path: FireplaceRemote.ipa
