name: Compile iOS IPA Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Initialize Java Environment
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Fetch Library Dependencies
      run: flutter pub get

    - name: Build iOS Workspace Directory
      run: flutter build ios --release --no-codesign

    - name: Package App Architecture into IPA Archive
      run: |
        mkdir -p Payload
        mv build/ios/iphoneos/Runner.app Payload/
        zip -r FireplaceRemote.ipa Payload

    - name: Archive IPA Output Artifact to GitHub Dashboard
      uses: actions/upload-artifact@v3
      with:
        name: Compiled-iPhone-App
        path: FireplaceRemote.ipa
